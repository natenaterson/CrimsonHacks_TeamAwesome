<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utah Wayfinder</title>
<meta name="description" content="Find and compare Utah parks, ski resorts, campgrounds and more for your trip dates.">
<style>
:root{
  --bg:#F5F0E6; --card:#FFFFFF; --ink:#1F2A1F; --muted:#56604F; --line:#DDD5C4;
  --brand:#2F5233; --accent:#3B6E4A; --accent-soft:#E4EEDF;
  --warn-bg:#EDE3CF; --warn-ink:#5B4A2A;
  --great:#1E5B2E; --good:#4D6B2A; --fair:#7A6A2E; --off:#6B7280;
  --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;padding-bottom:100px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
.top{background:linear-gradient(135deg,#1F3B24,#2F5233 55%,#4A6B45);color:#fff;padding:14px 16px 18px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{flex:none}
.logo h1{font-size:1.25rem;margin:0}
.logo p{margin:0;font-size:.85rem;opacity:.92}
.units{display:flex;background:rgba(255,255,255,.18);border-radius:999px;padding:3px}
.units button{border:0;background:transparent;color:#fff;min-width:44px;min-height:38px;border-radius:999px;font-weight:600;padding:0 10px;font-size:.85rem}
.units button[aria-pressed=true]{background:#fff;color:var(--brand)}
.search{margin-top:14px;background:#fff;color:var(--ink);border-radius:var(--radius);padding:12px;display:grid;gap:12px;box-shadow:var(--shadow)}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:4px}
.locrow{display:flex;gap:8px}
.search input[type=text],.search input[type=date]{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.btn-loc{flex:none;min-height:44px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:0 12px;font-weight:700;white-space:nowrap}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);margin-top:8px}
.presets button{border:1px dashed #C9BFB2;background:#fff;border-radius:999px;padding:0 12px;min-height:36px}
.locnote{font-size:.8rem;color:var(--muted);margin:4px 0 0}

/* Chips & toolbar */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 14px;min-height:40px;font-weight:500}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 16px}
.btn-filters{min-height:44px;border:1px solid var(--ink);background:#fff;border-radius:10px;padding:0 14px;font-weight:700;white-space:nowrap}
.toolbar select{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;flex:1;min-width:0}
.count{padding:0 16px;color:var(--muted);font-size:.9rem;margin:4px 0 10px}

/* Layout */
main{min-width:0}
#results,#mapview{margin:0 16px}
.cards{display:grid;gap:16px}
.empty{background:#fff;border-radius:var(--radius);padding:24px;text-align:center;color:var(--muted)}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.banner{position:relative;height:150px;display:block;border:0;width:100%;padding:0;background-color:#D7E3CF;background-size:cover;background-position:center bottom}
.banner .type{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:.75rem;font-weight:700;padding:4px 9px;border-radius:999px}
.score{position:absolute;right:12px;bottom:-20px;background:#fff;color:var(--ink);border-radius:12px;box-shadow:var(--shadow);padding:6px 10px;text-align:center;line-height:1.1;min-width:64px}
.score b{display:block;font-size:1.35rem}
.score small{font-size:.7rem;font-weight:700}
.s-great b,.s-great small{color:var(--great)} .s-good b,.s-good small{color:var(--good)}
.s-fair b,.s-fair small{color:var(--fair)} .s-off b,.s-off small{color:var(--off)}
.cbody{padding:12px 14px 14px}
.cbody h2{font-size:1.1rem;margin:0 84px 4px 0}
.meta{font-size:.9rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.badge{font-size:.78rem;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 9px;font-weight:700}
.badge.warn{background:var(--warn-bg);color:var(--warn-ink)}
.badge.plain{background:#F1ECE4;color:var(--ink);font-weight:500}
.cactions{display:flex;gap:8px}
.cactions button{flex:1;min-height:44px;border-radius:10px;font-weight:700}
.btn-details{border:0;background:var(--brand);color:#fff}
.btn-compare{border:1px solid #C9BFB2;background:#fff;min-height:44px;border-radius:10px;font-weight:700}
.btn-compare[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* Filter sheet (mobile) / sidebar (desktop) */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none}
.backdrop.show{display:block}
.filters{position:fixed;left:0;right:0;bottom:0;max-height:85vh;background:#fff;border-radius:18px 18px 0 0;z-index:50;transform:translateY(100%);transition:transform .25s ease;display:flex;flex-direction:column;visibility:hidden}
.filters.open{transform:none;visibility:visible}
.fhead{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.fhead h2{margin:0;font-size:1.1rem}
.xbtn{border:0;background:none;min-width:44px;min-height:44px;font-size:1.3rem;border-radius:10px}
.fbody{overflow:auto;padding:0 16px 8px}
.fbody fieldset{border:0;border-bottom:1px solid var(--line);margin:0;padding:12px 0}
.fbody legend{font-weight:800;padding:0;margin-bottom:4px}
.opt{display:flex;align-items:center;gap:10px;min-height:40px}
.opt input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.ffoot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.ffoot button{flex:1;min-height:48px;border-radius:10px;font-weight:800}
.btn-clear{background:#fff;border:1px solid var(--ink)}
.btn-show{background:var(--accent);color:#fff;border:0}
.fnote{font-size:.8rem;color:var(--muted);margin:6px 0 0}

/* Compare tray & map button */
.tray{position:fixed;left:12px;right:12px;bottom:12px;z-index:30;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,.25);transform:translateY(160%);transition:transform .2s}
.tray.show{transform:none}
.tray .names{flex:1;min-width:0;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray button{min-height:44px;border-radius:10px;font-weight:800;border:0;padding:0 14px}
.tray .go{background:#fff;color:var(--ink)}
.tray .go:disabled{opacity:.6;cursor:default}
.tray .clr{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45)}
.fab{position:fixed;right:16px;bottom:20px;z-index:20;border:0;background:var(--accent);color:#fff;border-radius:999px;min-height:48px;padding:0 18px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.2);transition:bottom .2s}
body.has-tray .fab{bottom:88px}

/* Dialogs */
dialog{border:0;padding:0;width:100%;max-width:640px;max-height:92vh;border-radius:18px 18px 0 0;margin:auto auto 0;background:#fff;color:var(--ink)}
dialog.wide{max-width:960px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dhead{position:sticky;top:0;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line);z-index:2}
.dhead h2{margin:0;font-size:1.15rem}
.dbody{padding:16px}
.dbody h3{font-size:1rem;margin:20px 0 6px}
.dbody p{margin:0 0 8px}
.callout{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:12px 0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:.92rem}
.fact span{display:block;font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.acc{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px;font-size:.92rem}
.disclaimer{font-size:.8rem;color:var(--muted);margin-top:16px!important}
.ctable-wrap{overflow-x:auto;padding:0 0 8px}
.ctable{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem}
.ctable th,.ctable td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
.ctable thead th{background:#fff;font-size:1rem}
.ctable tbody th{color:var(--muted);font-weight:700;width:130px;position:sticky;left:0;background:#fff}
.best{color:var(--great);font-weight:800}
.best::after{content:" ✓"}

/* Map */
.map{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:12px}
.map svg{width:100%;max-height:70vh;display:block}
.map .note{font-size:.8rem;color:var(--muted);margin:8px 0 0}
.pin{cursor:pointer}
.pin:focus{outline:none}
.pin:focus circle{stroke:#2563EB;stroke-width:4}

/* Month strip, lists, reviews */
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end;margin-top:8px}
.mcell{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px 0;border-radius:6px;height:96px}
.mcell.trip{background:var(--accent-soft);outline:2px solid var(--accent)}
.mbar{width:70%;border-radius:4px 4px 0 0}
.c-great{background:#16A34A}.c-good{background:#65A30D}.c-fair{background:#C9B97A}.c-off{background:#9CA3AF}
.mcrowd{font-size:.75rem;letter-spacing:-1px;color:#6B4F2A;line-height:1;height:10px;margin-top:3px}
.mname{font-size:.72rem;font-weight:700;color:var(--muted);margin-top:2px}
.list{margin:6px 0 0;padding-left:20px}.list li{margin:4px 0}
.checklist{list-style:none;padding:0;margin:6px 0 0}.checklist li{margin:4px 0}.checklist li::before{content:"☐  ";color:var(--accent)}
.review{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.review .stars{color:#7A6A2E;letter-spacing:1px}
.review .who{font-size:.85rem;color:var(--muted)}
.callout.warn{background:var(--warn-bg);color:var(--warn-ink)}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:.9rem;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.show{opacity:1}

@media (min-width:700px){ dialog{border-radius:18px;margin:auto} }
@media (min-width:900px){
  .top{padding:18px 32px 22px}
  .brandrow,.search{max-width:1200px;margin-left:auto;margin-right:auto}
  .search{grid-template-columns:1.3fr 1fr;align-items:start;margin-top:16px}
  .layout{display:grid;grid-template-columns:280px 1fr;gap:24px;max-width:1200px;margin:16px auto 0;padding:0 32px}
  .filters{position:sticky;top:12px;transform:none;visibility:visible;max-height:calc(100vh - 24px);border-radius:var(--radius);box-shadow:var(--shadow);align-self:start;z-index:1}
  .filters .xbtn,.ffoot .btn-show,.btn-filters{display:none}
  .backdrop{display:none!important}
  .chips,.toolbar,.count{padding-left:0;padding-right:0}
  #results,#mapview{margin:0}
  .cards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
}
</style>
</head>
<body>

<header class="top">
  <div class="brandrow">
    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="#fff" stroke-width="2.5"/><polygon points="20,6 25,20 20,34 15,20" fill="#fff"/><polygon points="20,6 25,20 15,20" fill="#E8DCC0"/></svg>
      <div><h1>Utah Wayfinder</h1><p>From powder to sandstone</p></div>
    </div>
    <div class="units" role="group" aria-label="Units">
      <button type="button" data-units="F" aria-pressed="true">°F · mi</button>
      <button type="button" data-units="C" aria-pressed="false">°C · km</button>
    </div>
  </div>

  <form class="search" onsubmit="return false">
    <div class="field">
      <label for="loc">Starting from</label>
      <div class="locrow">
        <input type="text" id="loc" list="cities" value="Salt Lake City, UT" autocomplete="off">
        <button type="button" class="btn-loc" id="useLoc">📍 Near me</button>
      </div>
      <datalist id="cities"></datalist>
      <p class="locnote" id="locNote">Using Salt Lake City. Tap "Near me" to use your current location.</p>
    </div>
    <div class="field">
      <div class="dates">
        <div><label for="start">Arrive</label><input type="date" id="start"></div>
        <div><label for="end">Leave</label><input type="date" id="end"></div>
      </div>
      <div class="presets"><span>Try:</span>
        <button type="button" data-preset="spring">🌸 Spring break</button>
        <button type="button" data-preset="summer">☀️ Summer</button>
        <button type="button" data-preset="ski">❄️ Ski week</button>
      </div>
    </div>
  </form>
</header>

<div class="layout">
  <div class="backdrop" id="backdrop"></div>
  <aside class="filters" id="filters" aria-label="Filters">
    <div class="fhead"><h2>Filters</h2><button class="xbtn" id="fclose" aria-label="Close filters">✕</button></div>
    <div class="fbody" id="fbody"></div>
    <div class="ffoot"><button class="btn-clear" id="clearAll">Clear all</button><button class="btn-show" id="showRes">Show results</button></div>
  </aside>

  <main>
    <div class="chips" id="chips" role="group" aria-label="Quick filters"></div>
    <div class="toolbar">
      <button class="btn-filters" id="openFilters">⚙︎ Filters</button>
      <label class="sr-only" for="sort">Sort by</label>
      <select id="sort">
        <option value="score">Sort: Best for your dates</option>
        <option value="drive">Sort: Closest</option>
        <option value="rating">Sort: Top rated</option>
        <option value="crowds">Sort: Fewest crowds</option>
      </select>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <div id="results" class="cards"></div>
    <div id="mapview" class="map" hidden></div>
  </main>
</div>

<button class="fab" id="fab">🗺️ Map</button>

<div class="tray" id="tray" aria-live="polite">
  <div class="names" id="trayNames"></div>
  <button class="clr" id="trayClear">Clear</button>
  <button class="go" id="trayGo">Compare</button>
</div>

<dialog id="detail" aria-labelledby="detailTitle"></dialog>
<dialog id="compare" class="wide" aria-labelledby="compareTitle"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
// Utah Wayfinder: SAMPLE DATA for the hackathon prototype.
// Facts are approximate; spot-check anything you say out loud in the demo.
//
// Field names follow RIDB (Recreation.gov) where RIDB has one:
//   FacilityID, FacilityName, FacilityDescription, FacilityLatitude, FacilityLongitude, Activities
// Everything else (Type, Season, Crowds, HighsF, Access, tips) is our own "enrichment" layer
// that RIDB does not provide. When the Python team swaps in RIDB, they keep these extra fields.
//
// Season:  0-100 score per month (Jan..Dec) for how good a visit is that month.
// Crowds:  1 = low, 2 = moderate, 3 = busy, per month.
// HighsF:  average daily high in °F per month.
// CostTier: 0 = free, 1 = under $20, 2 = $20+.

const SEASON = {
  desert:     [45, 50, 75, 92, 90, 70, 55, 58, 85, 95, 70, 45],
  dixie:      [70, 75, 90, 92, 80, 50, 35, 38, 65, 90, 85, 70],
  highDesert: [55, 55, 60, 70, 88, 95, 90, 88, 92, 80, 60, 55],
  ski:        [98, 100, 95, 70, 15, 10, 10, 10, 12, 20, 60, 92],
  skiSummer:  [98, 100, 95, 65, 30, 60, 72, 72, 65, 45, 55, 92],
  lake:       [25, 25, 35, 45, 65, 90, 100, 98, 72, 45, 25, 25],
  valley:     [50, 55, 70, 80, 70, 55, 45, 50, 80, 85, 65, 50],
  alpine:     [0, 0, 0, 0, 10, 60, 95, 95, 85, 30, 0, 0],
  saltflats:  [50, 50, 60, 62, 65, 72, 72, 75, 85, 80, 60, 50],
  cave:       [0, 0, 0, 0, 80, 92, 92, 90, 85, 55, 0, 0],
  yearRound:  [95, 95, 90, 80, 80, 88, 92, 92, 88, 82, 80, 92]
};

const CROWDS = {
  bigPark: [1, 1, 2, 3, 3, 3, 3, 3, 3, 3, 2, 1],
  midPark: [1, 1, 2, 2, 3, 3, 3, 3, 2, 2, 1, 1],
  quiet:   [1, 1, 1, 2, 2, 2, 2, 2, 2, 2, 1, 1],
  ski:     [3, 3, 3, 2, 1, 1, 1, 1, 1, 1, 1, 3],
  summer:  [1, 1, 1, 1, 2, 3, 3, 3, 2, 1, 1, 1]
};

const HIGHS_F = {
  stgeorge:  [54, 60, 68, 77, 87, 97, 102, 100, 92, 79, 64, 54],
  moab:      [44, 52, 64, 73, 83, 94, 100, 97, 88, 74, 57, 45],
  bryce:     [37, 40, 46, 54, 64, 75, 81, 78, 70, 58, 45, 37],
  capreef:   [42, 48, 57, 65, 75, 86, 91, 88, 80, 66, 52, 42],
  wasatch:   [30, 32, 38, 44, 53, 64, 73, 71, 62, 49, 37, 30],
  parkcity:  [33, 36, 44, 52, 62, 73, 81, 79, 70, 57, 43, 34],
  slc:       [38, 44, 54, 62, 72, 84, 93, 91, 79, 64, 50, 38],
  bearlake:  [30, 34, 43, 52, 62, 72, 81, 80, 70, 57, 42, 31],
  uintas:    [25, 28, 34, 40, 50, 62, 70, 68, 59, 46, 33, 26],
  brianhead: [32, 33, 38, 44, 53, 65, 72, 70, 62, 51, 39, 32]
};

const A = (wheelchair, stroller, paved, restrooms, quiet, shade, medical) =>
  ({ wheelchair, stroller, paved, restrooms, quiet, shade, medical });

const PLACES = [
  {
    FacilityID: "zion", FacilityName: "Zion National Park", Type: "National Park",
    FacilityDescription: "Towering red and cream cliffs, the Virgin River, and famous hikes like The Narrows and Angels Landing. Utah's most visited park.",
    FacilityLatitude: 37.2982, FacilityLongitude: -113.0263, ElevationFt: 4000,
    Activities: ["Hiking", "Camping", "Biking", "Water", "Scenic Drive", "Wildlife"],
    Rating: 4.9, Reviews: 48210, Cost: "$35 per vehicle (7 days)", CostTier: 2,
    Reservation: false, ReservationNote: "No reservation to enter. Angels Landing needs a permit from a lottery on Recreation.gov.",
    Season: SEASON.desert, Crowds: CROWDS.bigPark, HighsF: HIGHS_F.stgeorge,
    Access: A(true, true, true, true, false, false, false),
    AccessDetails: "Riverside Walk is paved, about 2.2 miles round trip and mostly flat. The Pa'rus Trail is paved. Park shuttles are wheelchair accessible.",
    QuietTime: "Weekday mornings before 8am, or December to February.",
    Tip: "Summer highs pass 100°F. Hike early, carry at least 1 gallon (4 L) of water per person per day.",
    DogFriendly: false, FamilyFriendly: true
  },
  {
    FacilityID: "arches", FacilityName: "Arches National Park", Type: "National Park",
    FacilityDescription: "Over 2,000 natural stone arches, including Delicate Arch, the arch on Utah's license plate.",
    FacilityLatitude: 38.7331, FacilityLongitude: -109.5925, ElevationFt: 4800,
    Activities: ["Hiking", "Camping", "Scenic Drive", "Stargazing"],
    Rating: 4.8, Reviews: 39120, Cost: "$30 per vehicle (7 days)", CostTier: 2,
    Reservation: true, ReservationNote: "Timed entry reservation needed in peak season (spring through fall). Book on Recreation.gov.",
    Season: SEASON.desert, Crowds: CROWDS.bigPark, HighsF: HIGHS_F.moab,
    Access: A(true, true, true, true, false, false, true),
    AccessDetails: "Park Avenue Viewpoint, the Windows area and the lower Delicate Arch Viewpoint have accessible viewing. Most trails are uneven slickrock.",
    QuietTime: "Before 7am or after 5pm; winter is very quiet.",
    Tip: "Moab is the nearest town (10 minutes). Very little shade; bring sun protection.",
    DogFriendly: false, FamilyFriendly: true
  },
  {
    FacilityID: "bryce", FacilityName: "Bryce Canyon National Park", Type: "National Park",
    FacilityDescription: "A giant natural amphitheater filled with orange hoodoos (rock spires). Stunning at sunrise and under snow.",
    FacilityLatitude: 37.5930, FacilityLongitude: -112.1871, ElevationFt: 8000,
    Activities: ["Hiking", "Camping", "Scenic Drive", "Stargazing", "Skiing"],
    Rating: 4.9, Reviews: 31540, Cost: "$35 per vehicle (7 days)", CostTier: 2,
    Reservation: false, ReservationNote: "",
    Season: SEASON.highDesert, Crowds: CROWDS.bigPark, HighsF: HIGHS_F.bryce,
    Access: A(true, true, true, true, false, false, false),
    AccessDetails: "The Rim Trail between Sunset Point and Sunrise Point is paved and mostly flat (about 1 mile). Viewpoints along the main road are accessible.",
    QuietTime: "Sunrise on weekdays; winter for snow and solitude.",

           cost: new Set(), noRes: false, access: new Set(), dog: false, family: false, lowCrowd: false };
}

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2, "0");
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
function nextDate(month, day) {
  const t = new Date(); const d = new Date(t.getFullYear(), month, day);
  if (d < t) d.setFullYear(t.getFullYear() + 1);
  return d;
}
function tripMonths() {
  let a = parse(state.start), b = parse(state.end);
  if (b < a) [a, b] = [b, a];
  const out = [];
  for (let d = new Date(a); d <= b && out.length < 90; d = addDays(d, 1)) out.push(d.getMonth());
  return out;
}
function fmtRange() {
  const a = parse(state.start), b = parse(state.end);
  const f = d => `${MONTHS[d.getMonth()]} ${d.getDate()}`;
  return a.getTime() === b.getTime() ? f(a) : `${f(a)} to ${f(b)}`;
}

/* ---------- Calculations ---------- */
const avgBy = (arr, months) => months.reduce((s, m) => s + arr[m], 0) / months.length;
function miles(lat1, lon1, lat2, lon2) {
  const R = 3958.8, r = x => x * Math.PI / 180;
  const dLat = r(lat2 - lat1), dLon = r(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(r(lat1)) * Math.cos(r(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function compute(p) {
  const months = tripMonths();
  const roadMiles = miles(state.loc.lat, state.loc.lon, p.FacilityLatitude, p.FacilityLongitude) * 1.3;
  return {
    score: Math.round(avgBy(p.Season, months)),
    crowd: avgBy(p.Crowds, months),
    highF: Math.round(avgBy(p.HighsF, months)),
    miles: roadMiles,
    hrs: roadMiles / 65
  };
}
const scoreLabel = s => s >= 85 ? ["Great", "great"] : s >= 70 ? ["Good", "good"] : s >= 50 ? ["Fair", "fair"] : ["Off-season", "off"];
const crowdLabel = c => c < 1.5 ? "Low" : c < 2.5 ? "Moderate" : "Busy";
const temp = f => state.units === "F" ? `${f}°F` : `${Math.round((f - 32) * 5 / 9)}°C`;
const dist = mi => state.units === "F" ? `${Math.round(mi)} mi` : `${Math.round(mi * 1.609)} km`;
const elev = ft => state.units === "F" ? `${ft.toLocaleString()} ft` : `${Math.round(ft * 0.3048).toLocaleString()} m`;
function driveTxt(h) {
  if (h < 0.25) return "Nearby";
  let H = Math.floor(h), M = Math.round((h - H) * 12) * 5;
  if (M === 60) { H++; M = 0; }
  return H ? `${H}h${M ? " " + M + "m" : ""}` : `${M}m`;
}
const yn = b => b ? "✅ Yes" : "➖ No";
function bestMonths(p) {
  const m = p.Season.map((s, i) => [s, i]).filter(([s]) => s >= 85).map(([, i]) => MONTHS[i]);
  return m.length ? `Best months: ${m.join(", ")}.` : "";
}

/* ---------- Filtering ---------- */
function passes(p, c) {
  const f = state.f;
  if (f.types.size && !f.types.has(p.Type)) return false;
  if (f.acts.size && ![...f.acts].some(a => p.Activities.includes(a))) return false;
  if (p.Rating < f.minRating) return false;
  if (f.goodDates && c.score < 70) return false;
  if (f.maxDrive && c.hrs > f.maxDrive) return false;
  if (f.cost.size && !f.cost.has(p.CostTier)) return false;
  if (f.noRes && p.Reservation) return false;
  for (const k of f.access) if (!p.Access[k]) return false;
  if (f.dog && !p.DogFriendly) return false;
  if (f.family && !p.FamilyFriendly) return false;
  if (f.lowCrowd && c.crowd >= 2) return false;
  return true;
}
function activeCount() {
  const f = state.f;
  return f.types.size + f.acts.size + f.cost.size + f.access.size +
    [f.minRating, f.goodDates, f.maxDrive, f.noRes, f.dog, f.family, f.lowCrowd].filter(Boolean).length;
}
const SORTS = {
  score:  (a, b) => b.c.score - a.c.score || b.p.Rating - a.p.Rating,
  drive:  (a, b) => a.c.hrs - b.c.hrs,
  rating: (a, b) => b.p.Rating - a.p.Rating || b.c.score - a.c.score,
  crowds: (a, b) => a.c.crowd - b.c.crowd || b.c.score - a.c.score
};

function sceneURL(p) {
  const flip = [...p.FacilityID].reduce((s, ch) => s + ch.charCodeAt(0), 0) % 2 === 1;
  const key = p.Type + (flip ? "-f" : "");
  if (!sceneCache[key]) {

      <p>${p.Tip}</p>
      <h3>💬 Reviews <small style="font-weight:400;color:var(--muted)">(sample text for the prototype)</small></h3>
      ${p.UserReviews.map(([who, stars, text]) => `<div class="review"><div class="stars" aria-label="${stars} out of 5 stars">${"★".repeat(stars)}${"☆".repeat(5 - stars)}</div><p>"${text}"</p><div class="who">${who}</div></div>`).join("")}
      <button class="btn-compare" style="width:100%;margin-top:12px" data-compare="${p.FacilityID}"></button>
      <p class="disclaimer">Prototype with sample data. Based on park information; confirm with the park before you go.</p>
    </div>`;
  syncCompareButtons();
  if (!d.open) d.showModal();
  d.scrollTop = 0;
}

function monthRanges(idx) {
  if (!idx.length) return "";
  if (idx.length === 12) return "all year";
  const set = new Set(idx); let start = 0;
  while (set.has(start)) start++;
  const out = []; let run = null;
  for (let k = 1; k <= 12; k++) {
    const m = (start + k) % 12;
    if (set.has(m)) { if (!run) run = [m, m]; else run[1] = m; }
    else if (run) { out.push(run); run = null; }
  }
  return out.map(([a, b]) => a === b ? MONTHS[a] : `${MONTHS[a]} to ${MONTHS[b]}`).join(", ");
}
const busyMonths = p => monthRanges(p.Crowds.map((v, i) => v === 3 ? i : -1).filter(i => i >= 0));
function monthStrip(p) {
  const trip = new Set(tripMonths());
  const cells = MONTHS.map((m, i) => {
    const cls = scoreLabel(p.Season[i])[1];
    return `<div class="mcell ${trip.has(i) ? "trip" : ""}" title="${m}: score ${p.Season[i]}, ${crowdLabel(p.Crowds[i]).toLowerCase()} crowds">
      <div class="mbar c-${cls}" style="height:${Math.max(4, Math.round(p.Season[i] * 0.55))}px"></div>
      <div class="mcrowd">${"•".repeat(p.Crowds[i])}</div><div class="mname">${m[0]}</div></div>`;
  }).join("");
  const busy = busyMonths(p);
  return `<div class="strip" role="img" aria-label="Season score and crowds by month. ${bestMonths(p)} ${busy ? "Busiest: " + busy + "." : ""}">${cells}</div>
    <p class="fnote">Bar = how good that month is. Brown dots = crowds (more dots, busier). Outlined = your trip.${busy ? ` <b>Busiest: ${busy}.</b>` : ""}</p>`;
}
function expectList(p, c) {
  const busy = busyMonths(p);
  const L = [`Weather: average highs near ${temp(c.highF)} for your dates.`];
  L.push(`Crowds: ${crowdLabel(c.crowd).toLowerCase()} for your dates.${busy ? ` Busiest months: ${busy}.` : ""}`);
  L.push(`Elevation: ${elev(p.ElevationFt)}.${p.ElevationFt >= 7000 ? " You may feel short of breath; take it slow and drink extra water." : ""}`);
  if (p.ReservationNote) L.push(`Reservations: ${p.ReservationNote}`);
  L.push(`Getting there: about ${driveTxt(c.hrs)} (${dist(c.miles)}) from ${state.loc.name}.`);
  if (c.score < 50) L.push("Off-season for your dates: some roads, tours or services may be closed.");
  return L;
}
function packingList(p, c) {
  const L = ["Refillable water bottle (Utah is very dry)", "Sunscreen, sunglasses and a hat"];
  if (c.highF >= 85) L.push("Extra water: about 1 gallon (4 L) per person per day", "Light, breathable clothing");
  else if (c.highF <= 50) L.push("Warm layers, gloves and a warm hat");
  else L.push("Layers: mornings and evenings get cool");
  if (p.ElevationFt >= 7000 && c.highF > 50) L.push("A warm jacket for cold nights at elevation");
  if (p.Activities.includes("Hiking")) L.push("Sturdy shoes with good grip");
  if (p.Activities.includes("Water") && c.highF >= 70) L.push("Swimsuit, water shoes and a towel");
  if (p.Activities.includes("Skiing") && c.highF <= 50) L.push("Ski goggles and a waterproof jacket");
  if (p.Activities.includes("Stargazing")) L.push("Headlamp with a red-light setting for stargazing");
  if (p.Activities.includes("Camping")) L.push("Camping gear (rentals in nearby towns)");
  if (!p.Access.medical) L.push("First-aid kit and medications (services are far away)");
  L.push("Offline maps downloaded (cell service is spotty)");
  return L;
}

/* ---------- Compare ---------- */
function toggleCompare(id) {
  const i = state.compare.indexOf(id);
  if (i >= 0) state.compare.splice(i, 1);
  else if (state.compare.length >= 3) { toast("You can compare up to 3 places"); return; }
  else state.compare.push(id);
  render();
}
function syncCompareButtons() {
  document.querySelectorAll("[data-compare]").forEach(b => {
    const on = state.compare.includes(b.dataset.compare);
    b.setAttribute("aria-pressed", on);
    b.textContent = on ? "✓ Comparing" : "+ Compare";
  });
}
function renderTray() {
  const n = state.compare.length;
  $("tray").classList.toggle("show", n > 0);
  document.body.classList.toggle("has-tray", n > 0);
  $("trayNames").textContent = state.compare.map(id => byId(id).FacilityName).join(" · ");
  $("trayGo").disabled = n < 2;
  $("trayGo").textContent = n < 2 ? "Add 1 more" : `Compare ${n}`;
}
function openCompare() {
  const items = state.compare.map(id => { const p = byId(id); return { p, c: compute(p) }; });
  const ROWS = [
    ["Score for your dates", r => `${r.c.score} (${scoreLabel(r.c.score)[0]})`, r => r.c.score, "max"],
    ["Rating", r => `⭐ ${r.p.Rating.toFixed(1)}`, r => r.p.Rating, "max"],
    ["Drive", r => `${driveTxt(r.c.hrs)} (${dist(r.c.miles)})`, r => r.c.hrs, "min"],
    ["Avg high", r => temp(r.c.highF)],
    ["Crowds", r => crowdLabel(r.c.crowd), r => r.c.crowd, "min"],
    ["Busiest months", r => busyMonths(r.p) || "Rarely busy"],
    ["Cost", r => r.p.Cost, r => r.p.CostTier, "min"],
    ["Reservation", r => r.p.Reservation ? "📅 Needed" : "Not needed"],
    ["Wheelchair", r => yn(r.p.Access.wheelchair)],
    ["Stroller", r => yn(r.p.Access.stroller)],
    ["Quieter option", r => yn(r.p.Access.quiet)],
    ["Dogs", r => yn(r.p.DogFriendly)],
    ["Activities", r => r.p.Activities.join(", ")],
    ["Quieter visit", r => r.p.QuietTime]
  ];
  const body = ROWS.map(([label, show, val, dir]) => {
    let best = null;
    if (val) {
      const vals = items.map(val);
      const target = dir === "max" ? Math.max(...vals) : Math.min(...vals);
      if (!vals.every(v => v === target)) best = target;
    }
    return `<tr><th scope="row">${label}</th>${items.map(r => `<td class="${best !== null && val(r) === best ? "best" : ""}">${show(r)}</td>`).join("")}</tr>`;
  }).join("");
  $("compare").innerHTML = `
    <div class="dhead"><h2 id="compareTitle">Compare for ${fmtRange()}</h2><button class="xbtn" data-close aria-label="Close">✕</button></div>
    <div class="dbody">
      <div class="ctable-wrap"><table class="ctable">
        <thead><tr><th></th>${items.map(r => `<th scope="col">${TYPE_STYLE[r.p.Type].icon} ${r.p.FacilityName}</th>`).join("")}</tr></thead>
        <tbody>${body}</tbody>
      </table></div>
      <p class="disclaimer">✓ marks the best value in a row. Prototype with sample data; confirm details with each park.</p>
    </div>`;
  $("compare").showModal();
}

/* ---------- Location ---------- */
function setLocationFromText(v) {
  const key = v.toLowerCase().split(",")[0].replace("(fly-in)", "").trim();
  const m = CITIES.find(c => c[0].toLowerCase().startsWith(key));
  if (key && m) {
    state.loc = { name: m[0], lat: m[1], lon: m[2] };
    $("loc").value = m[0];
    $("locNote").textContent = "";
  } else {
    $("locNote").textContent = `This prototype knows a few cities. Still using ${state.loc.name}.`;
  }
  render();
}
function useMyLocation(silent) {
  if (!navigator.geolocation) { if (!silent) toast("Location isn't available in this browser"); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    state.loc = { name: "your location", lat: pos.coords.latitude, lon: pos.coords.longitude };
    $("loc").value = "📍 My location";
    $("locNote").textContent = "";
    render();
  }, () => { if (!silent) toast(`Couldn't get your location. Using ${state.loc.name}.`); }, { timeout: 8000 });
}

/* ---------- Misc ---------- */
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  const det = t.closest("[data-detail]"); if (det) { openDetail(det.dataset.detail); return; }
  const cmp = t.closest("[data-compare]"); if (cmp) { toggleCompare(cmp.dataset.compare); return; }
  const chip = t.closest("[data-chip]"); if (chip) { CHIPS[chip.dataset.chip].go(); render(); return; }
  if (t.closest("[data-close]")) { t.closest("dialog").close(); return; }
  if (t.tagName === "DIALOG") t.close(); // tap outside the dialog panel
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".pin")) { e.preventDefault(); openDetail(e.target.dataset.detail); }
  if (e.key === "Escape" && $("filters").classList.contains("open")) closeSheet();
});
document.querySelectorAll("[data-units]").forEach(b => b.addEventListener("click", () => {
  state.units = b.dataset.units;
  document.querySelectorAll("[data-units]").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
  if ($("detail").open) openDetail($("detail").querySelector("[data-compare]").dataset.compare);
}));
document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => {
  const s = { spring: nextDate(2, 16), summer: nextDate(6, 10), ski: nextDate(1, 8) }[b.dataset.preset];
  state.start = isoLocal(s); state.end = isoLocal(addDays(s, 4));
  $("start").value = state.start; $("end").value = state.end;
  render();
  toast(`Re-ranked for ${fmtRange()}`);
}));
["start", "end"].forEach(id => $(id).addEventListener("change", () => {
  if (!$("start").value || !$("end").value) return;
  state.start = $("start").value; state.end = $("end").value;
  if (parse(state.end) < parse(state.start)) { [state.start, state.end] = [state.end, state.start]; $("start").value = state.start; $("end").value = state.end; }
  render();
}));
$("loc").addEventListener("change", e => setLocationFromText(e.target.value));
$("useLoc").addEventListener("click", () => useMyLocation(false));
$("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
$("openFilters").addEventListener("click", openSheet);
$("fclose").addEventListener("click", closeSheet);
$("backdrop").addEventListener("click", closeSheet);
$("showRes").addEventListener("click", closeSheet);
$("clearAll").addEventListener("click", () => { state.f = freshFilters(); render(); });
$("fab").addEventListener("click", () => { state.view = state.view === "map" ? "list" : "map"; render(); window.scrollTo({ top: $("count").offsetTop - 12, behavior: "smooth" }); });
$("trayGo").addEventListener("click", openCompare);
$("trayClear").addEventListener("click", () => { state.compare = []; render(); });

/* ---------- Init ---------- */
$("cities").innerHTML = CITIES.map(c => `<option value="${c[0]}">`).join("");
const today = new Date();
state.start = isoLocal(addDays(today, 7));
state.end = isoLocal(addDays(today, 10));
$("start").value = state.start; $("end").value = state.end;
buildFilters();
render();
// Default to current location when the browser already has permission (no surprise prompt mid-demo).
if (navigator.permissions) {
  navigator.permissions.query({ name: "geolocation" }).then(r => { if (r.state === "granted") useMyLocation(true); }).catch(() => {});
}
</script>
